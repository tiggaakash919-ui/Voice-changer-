name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project files
        run: |
          mkdir -p "VoiceChanger/$(dirname app/build.gradle.kts)"
          cat > VoiceChanger/app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.example.voicechanger"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.voicechanger"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }
              buildFeatures { compose = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF_FILE
          mkdir -p "VoiceChanger/$(dirname app/src/main/AndroidManifest.xml)"
          cat > VoiceChanger/app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-feature android:name="android.hardware.microphone" />
              <application android:label="Voice Changer" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p "VoiceChanger/$(dirname app/src/main/java/com/example/voicechanger/MainActivity.kt)"
          cat > VoiceChanger/app/src/main/java/com/example/voicechanger/MainActivity.kt <<'EOF_FILE'
          package com.example.voicechanger

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.view.WindowManager
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.core.content.ContextCompat

          class MainActivity : ComponentActivity() {
              private val params = Params()
              private var level by mutableFloatStateOf(0f)
              private val engine = VoiceEngine(params) { level = it }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContent { MaterialTheme(colorScheme = darkColorScheme()) { Surface { Screen() } } }
              }

              override fun onStop() { super.onStop(); engine.stop() }

              @Composable
              fun Screen() {
                  var running by remember { mutableStateOf(false) }
                  var preset by remember { mutableStateOf("Natural Female") }
                  var pitch by remember { mutableFloatStateOf(params.semitones) }
                  var bright by remember { mutableFloatStateOf(params.brightness) }
                  var breath by remember { mutableFloatStateOf(params.breath) }
                  var inten by remember { mutableFloatStateOf(params.intensity) }
                  var gate by remember { mutableFloatStateOf(params.gate) }
                  var vol by remember { mutableFloatStateOf(params.volume) }
                  val perm = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { ok ->
                      if (ok) { engine.start(); running = true }
                  }
                  fun apply(name: String, st: Float, b: Float, br: Float) {
                      preset = name; pitch = st; bright = b; breath = br
                      params.semitones = st; params.brightness = b; params.breath = br
                  }
                  Column(Modifier.padding(16.dp).verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      Text("Voice Changer (DSP effect, not AI)", style = MaterialTheme.typography.titleMedium)
                      Text(if (running) "● MIC LIVE — Use earphones/keep phones apart to avoid feedback" else "Stopped")
                      Button(onClick = {
                          if (running) { engine.stop(); running = false }
                          else if (ContextCompat.checkSelfPermission(this@MainActivity, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) { engine.start(); running = true }
                          else perm.launch(Manifest.permission.RECORD_AUDIO)
                      }, Modifier.fillMaxWidth()) { Text(if (running) "Stop" else "Start") }
                      LinearProgressIndicator(progress = { level.coerceIn(0f, 1f) }, Modifier.fillMaxWidth())
                      Text("Buffer latency estimate: ${engine.bufferLatencyMs} ms (not measured end-to-end) · underruns: ${engine.underruns}")
                      Text("Preset: $preset")
                      FlowRowButtons(listOf(
                          "Original" to { apply("Original", 0f, 0f, 0f) },
                          "Natural" to { apply("Natural Female", 5f, 0.3f, 0.05f) },
                          "Soft" to { apply("Soft Female", 4f, 0.1f, 0.2f) },
                          "Mature" to { apply("Mature Female", 3f, 0.15f, 0.08f) },
                          "Bright" to { apply("Bright Female", 6f, 0.5f, 0.05f) },
                          "Anime" to { apply("Anime-Inspired", 8f, 0.6f, 0.03f) }))
                      Sl("Pitch (semitones) ${"%.1f".format(pitch)}", pitch, -6f..12f) { pitch = it; params.semitones = it }
                      Sl("Brightness", bright, 0f..1f) { bright = it; params.brightness = it }
                      Sl("Breathiness", breath, 0f..0.5f) { breath = it; params.breath = it }
                      Sl("Voice intensity", inten, 0f..1f) { inten = it; params.intensity = it }
                      Sl("Noise gate", gate, 0f..0.1f) { gate = it; params.gate = it }
                      Sl("Output volume", vol, 0f..1.5f) { vol = it; params.volume = it }
                  }
              }

              @Composable fun Sl(label: String, v: Float, r: ClosedFloatingPointRange<Float>, on: (Float) -> Unit) {
                  Text(label); Slider(value = v, onValueChange = on, valueRange = r)
              }

              @Composable fun FlowRowButtons(items: List<Pair<String, () -> Unit>>) {
                  items.chunked(3).forEach { row ->
                      Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                          row.forEach { (t, a) -> OutlinedButton(onClick = a) { Text(t) } }
                      }
                  }
              }
          }
          EOF_FILE
          mkdir -p "VoiceChanger/$(dirname app/src/main/java/com/example/voicechanger/PitchShifter.kt)"
          cat > VoiceChanger/app/src/main/java/com/example/voicechanger/PitchShifter.kt <<'EOF_FILE'
          package com.example.voicechanger

          import kotlin.math.PI
          import kotlin.math.sin

          /** Simple delay-line pitch shifter (two crossfaded taps). This is an AUDIO EFFECT, not AI voice conversion.
           *  It shifts formants together with pitch, so large shifts sound artificial. */
          class PitchShifter(sampleRate: Int, windowMs: Int = 40) {
              private val size = 8192
              private val mask = size - 1
              private val buf = FloatArray(size)
              private var w = 0
              private val win = (sampleRate * windowMs / 1000).toFloat()
              private var p0 = 0f
              private var p1 = 0.5f

              private fun tap(p: Float): Float {
                  val d = p * win
                  val pos = w - d
                  val i = Math.floor(pos.toDouble()).toInt()
                  val f = (pos - i).toFloat()
                  val a = buf[i and mask]
                  val b = buf[(i + 1) and mask]
                  val g = sin(PI * p).toFloat()
                  return (a + (b - a) * f) * g * g
              }

              fun process(x: Float, ratio: Float): Float {
                  buf[w and mask] = x
                  val y = tap(p0) + tap(p1)
                  val dp = (1f - ratio) / win
                  p0 += dp; p1 += dp
                  if (p0 < 0f) p0 += 1f; if (p0 >= 1f) p0 -= 1f
                  if (p1 < 0f) p1 += 1f; if (p1 >= 1f) p1 -= 1f
                  w++
                  return y
              }
          }
          EOF_FILE
          mkdir -p "VoiceChanger/$(dirname app/src/main/java/com/example/voicechanger/VoiceEngine.kt)"
          cat > VoiceChanger/app/src/main/java/com/example/voicechanger/VoiceEngine.kt <<'EOF_FILE'
          package com.example.voicechanger

          import android.annotation.SuppressLint
          import android.media.*
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.pow

          class Params {
              @Volatile var semitones = 5f
              @Volatile var brightness = 0.3f   // 0..1
              @Volatile var breath = 0.05f      // 0..1
              @Volatile var intensity = 1f      // dry/wet 0..1
              @Volatile var gate = 0.01f        // noise gate threshold
              @Volatile var volume = 1f
          }

          class VoiceEngine(val params: Params, private val onLevel: (Float) -> Unit) {
              private val sr = 48000
              @Volatile private var running = false
              private var thread: Thread? = null
              @Volatile var underruns = 0
              @Volatile var bufferLatencyMs = 0   // ESTIMATE from buffer sizes only, not measured round-trip

              @SuppressLint("MissingPermission")
              fun start() {
                  if (running) return
                  running = true
                  thread = Thread {
                      val frame = sr / 100 // 10 ms
                      val minIn = AudioRecord.getMinBufferSize(sr, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_FLOAT)
                      val minOut = AudioTrack.getMinBufferSize(sr, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_FLOAT)
                      val rec = AudioRecord(MediaRecorder.AudioSource.MIC, sr, AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_FLOAT, max(minIn, frame * 4 * 2))
                      val trk = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build())
                          .setAudioFormat(AudioFormat.Builder().setSampleRate(sr).setEncoding(AudioFormat.ENCODING_PCM_FLOAT)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setPerformanceMode(AudioTrack.PERFORMANCE_MODE_LOW_LATENCY)
                          .setBufferSizeInBytes(max(minOut, frame * 4 * 2)).build()
                      bufferLatencyMs = ((max(minIn, frame * 8) + max(minOut, frame * 8)) / 4) * 1000 / sr
                      val shifter = PitchShifter(sr)
                      val data = FloatArray(frame)
                      var hp = 0f; var prev = 0f; var env = 0f; var rng = 12345
                      rec.startRecording(); trk.play()
                      while (running) {
                          var n = 0
                          while (n < frame && running) {
                              val r = rec.read(data, n, frame - n, AudioRecord.READ_BLOCKING)
                              if (r <= 0) break
                              n += r
                          }
                          val ratio = 2.0.pow(params.semitones / 12.0).toFloat()
                          var peak = 0f
                          for (i in 0 until n) {
                              var x = data[i]
                              env += (abs(x) - env) * 0.01f
                              if (env < params.gate) x *= 0.05f              // simple noise gate
                              val wet = shifter.process(x, ratio)
                              hp = 0.95f * (hp + wet - prev); prev = wet      // high-pass for brightness
                              var y = wet + hp * params.brightness
                              rng = rng * 1664525 + 1013904223
                              val noise = ((rng shr 9) / 4194304f - 1f) * env * params.breath
                              y += noise
                              y = x * (1f - params.intensity) + y * params.intensity
                              y = (y * params.volume).coerceIn(-0.98f, 0.98f)
                              data[i] = y
                              peak = max(peak, abs(y))
                          }
                          onLevel(peak)
                          trk.write(data, 0, n, AudioTrack.WRITE_BLOCKING)
                          underruns = trk.underrunCount
                      }
                      rec.stop(); rec.release(); trk.stop(); trk.release()
                  }.also { it.priority = Thread.MAX_PRIORITY; it.start() }
              }

              fun stop() { running = false; thread?.join(500); thread = null }
          }
          EOF_FILE
          mkdir -p "VoiceChanger/$(dirname build.gradle.kts)"
          cat > VoiceChanger/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_FILE
          mkdir -p "VoiceChanger/$(dirname gradle.properties)"
          cat > VoiceChanger/gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          mkdir -p "VoiceChanger/$(dirname settings.gradle.kts)"
          cat > VoiceChanger/settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VoiceChanger"
          include(":app")
          EOF_FILE
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build debug APK
        working-directory: VoiceChanger
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger-apk
          path: VoiceChanger/app/build/outputs/apk/debug/app-debug.apk
